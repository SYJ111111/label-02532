version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: blog_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
    ports:
      - "8080:8080"
    networks:
      - blog-net

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: blog-frontend-admin
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - blog-net

  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: blog-frontend-user
    depends_on:
      - backend
    ports:
      - "8082:80"
    networks:
      - blog-net

volumes:
  mysql-data:

networks:
  blog-net:
    driver: bridge
